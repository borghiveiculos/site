<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gol do Petrus</title>
    <link rel="icon" href="fav-icon.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Orbitron:wght@700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #06080d;
            --panel: rgba(12, 16, 24, 0.86);
            --panel-soft: rgba(255, 255, 255, 0.08);
            --line: rgba(255, 255, 255, 0.12);
            --text: #f5f7fb;
            --muted: #9ca8bd;
            --accent: #e01927;
            --accent-2: #ffb347;
            --good: #3ee27a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            min-height: 100%;
        }

        body {
            font-family: "Manrope", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top, rgba(224, 25, 39, 0.22), transparent 24%),
                linear-gradient(180deg, #101722 0%, #05070c 100%);
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 28px 28px;
            pointer-events: none;
            opacity: 0.35;
        }

        .shell {
            width: min(920px, calc(100% - 24px));
            margin: 0 auto;
            padding: 20px 0 28px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .back-link {
            border: 1px solid var(--line);
            background: var(--panel-soft);
            color: var(--text);
            text-decoration: none;
            backdrop-filter: blur(10px);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 12px 18px;
            border-radius: 16px;
            font-weight: 700;
        }

        .title-wrap {
            text-align: center;
            flex: 1;
        }

        .title-wrap h1 {
            font-family: "Orbitron", "Space Grotesk", sans-serif;
            font-size: clamp(1.55rem, 4vw, 2.3rem);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #ffffff;
            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.34),
                0 0 18px rgba(224, 25, 39, 0.42),
                0 0 32px rgba(224, 25, 39, 0.26);
        }

        .game-card {
            border: 1px solid var(--line);
            border-radius: 28px;
            background: var(--panel);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(16px);
        }

        .game-card {
            position: relative;
            overflow: hidden;
            padding: 16px;
            width: min(100%, 980px);
            margin: 0 auto;
        }

        .canvas-wrap {
            position: relative;
            width: 100%;
            max-width: 940px;
            margin: 0 auto;
        }

        canvas {
            width: 100%;
            aspect-ratio: 1280 / 1024;
            display: block;
            border-radius: 22px;
            touch-action: none;
        }

        .touch-controls {
            display: none;
            justify-content: center;
            gap: 54px;
            margin-top: 14px;
        }

        .touch-btn {
            min-width: 84px;
            min-height: 54px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(7, 10, 16, 0.72);
            color: #f8fafc;
            font-family: "Space Grotesk", sans-serif;
            font-size: 1.45rem;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
            -webkit-tap-highlight-color: transparent;
        }

        .touch-btn:active,
        .touch-btn.active {
            transform: translateY(1px) scale(0.98);
        }

        .game-hud {
            display: flex;
            align-items: start;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }

        .hud-stack {
            display: flex;
            align-items: start;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .fullscreen-btn {
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(7, 10, 16, 0.62);
            color: #f8fafc;
            backdrop-filter: blur(10px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
        }

        .hud-box {
            min-width: 120px;
            padding: 0;
            pointer-events: auto;
            background: transparent;
            border: 0;
            box-shadow: none;
            backdrop-filter: none;
            text-align: center;
        }

        .hud-box span {
            display: block;
            color: rgba(248, 250, 252, 0.66);
            font-size: 0.92rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .hud-box strong {
            display: block;
            margin-top: 4px;
            font-family: "Space Grotesk", sans-serif;
            font-size: 0.92rem;
        }

        .hud-box {
            min-width: 116px;
            padding: 0;
        }

        .hud-box span {
            display: block;
            color: rgba(248, 250, 252, 0.66);
            font-size: 0.92rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .hud-box strong {
            display: block;
            margin-top: 4px;
            font-family: "Space Grotesk", sans-serif;
            font-size: 0.92rem;
        }

        .speedometer {
            min-width: 132px;
        }

        .level-sign {
            min-width: 160px;
        }

        .fullscreen-btn {
            min-width: 48px;
            min-height: 48px;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }

        .fullscreen-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        @media (max-width: 780px) {
            .shell {
                width: min(100%, calc(100% - 12px));
                padding: 12px 0 20px;
            }

            .topbar {
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }

            .game-card {
                padding: 10px;
                width: min(100%, 100%);
            }

            canvas {
                max-width: 100%;
            }

            .game-hud {
                flex-direction: column;
                align-items: center;
            }

            .hud-stack {
                width: 100%;
            }

            .hud-box {
                min-width: 0;
                flex: 1 1 140px;
            }

            .fullscreen-btn {
                display: none;
            }

            .touch-controls {
                display: flex;
                gap: 78px;
                margin-top: 16px;
            }
        }

        .overlay {
            position: absolute;
            inset: 16px;
            border-radius: 22px;
            background: linear-gradient(180deg, rgba(5, 7, 12, 0.24), rgba(5, 7, 12, 0.84));
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            transition: opacity 0.25s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay-box {
            width: 100%;
            max-width: 460px;
            padding: 0;
        }

        .overlay-box h2 {
            font-family: "Orbitron", "Space Grotesk", sans-serif;
            text-transform: uppercase;
            font-size: clamp(1.5rem, 3vw, 2rem);
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.28),
                0 0 18px rgba(224, 25, 39, 0.36),
                0 0 26px rgba(224, 25, 39, 0.22);
        }

        .cover-car {
            width: min(220px, 62vw);
            margin: 0 auto 18px;
            filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.35));
        }

        .overlay-box p {
            color: #d6dbe6;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .overlay-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .start-btn {
            min-height: 52px;
            padding: 14px 24px;
            border: 0;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--accent), #9f0712);
            color: #ffffff;
            font-family: "Space Grotesk", sans-serif;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 16px 34px rgba(224, 25, 39, 0.32);
        }

        .share-btn {
            min-height: 52px;
            padding: 14px 24px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 18px;
            background: rgba(7, 10, 16, 0.72);
            color: #ffffff;
            font-family: "Space Grotesk", sans-serif;
            font-size: 1rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            display: none;
        }

        .share-btn.visible {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .score-board {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 18px;
            background: rgba(7, 10, 16, 0.52);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .score-board h3 {
            font-family: "Space Grotesk", sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(248, 250, 252, 0.82);
            margin-bottom: 8px;
        }

        .best-score {
            color: #ffffff;
            font-size: 1rem;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .recent-scores {
            list-style: none;
            display: grid;
            gap: 6px;
            color: #d6dbe6;
            font-size: 0.9rem;
        }

        .recent-scores li {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        @media (max-width: 780px) {
            .overlay {
                inset: 8px;
                align-items: flex-start;
                padding: 8px 6px;
                overflow-y: auto;
            }

            .cover-car {
                width: min(92px, 28vw);
                margin-bottom: 6px;
            }

            .overlay-box h2 {
                font-size: clamp(0.86rem, 4.2vw, 1.05rem);
                margin-bottom: 3px;
            }

            .overlay-box p {
                font-size: 0.66rem;
                line-height: 1.18;
                margin-bottom: 6px;
            }

            .overlay-box {
                max-width: min(100%, 252px);
                padding: 0;
            }

            .overlay-actions {
                gap: 6px;
            }

            .start-btn {
                width: 100%;
                min-height: 34px;
                padding: 8px 10px;
                font-size: 0.74rem;
                border-radius: 14px;
            }

            .share-btn {
                width: 100%;
                min-height: 34px;
                padding: 8px 10px;
                font-size: 0.74rem;
                border-radius: 14px;
            }

            .touch-btn {
                min-width: 108px;
                min-height: 64px;
                font-size: 1.7rem;
            }

            .score-board {
                margin-top: 8px;
                padding: 8px;
                border-radius: 14px;
            }

            .score-board h3 {
                font-size: 0.62rem;
                margin-bottom: 3px;
            }

            .best-score {
                font-size: 0.74rem;
                margin-bottom: 6px;
            }

            .recent-scores {
                font-size: 0.66rem;
                gap: 3px;
            }

            .recent-scores li {
                gap: 8px;
                flex-wrap: nowrap;
            }
        }

    </style>
</head>
<body>
    <div class="shell">
        <div class="topbar">
            <a class="back-link" href="index.html">Voltar ao site</a>
            <div class="title-wrap">
                <h1>Gol do Petrus</h1>
            </div>
            <div style="width:120px"></div>
        </div>

        <section class="game-card">
                <div class="canvas-wrap">
                <canvas id="gameCanvas" width="1280" height="1024" aria-label="Jogo Gol do Petrus"></canvas>
                <div class="overlay" id="overlay">
                    <div class="overlay-box">
                        <img src="gol.png" alt="Gol de abertura" class="cover-car">
                        <h2>Gol do Petrus</h2>
                        <p id="overlay-message">Desvie dos carros, ultrapasse o transito e acelere cada vez mais.</p>
                        <div class="overlay-actions">
                            <button class="start-btn" id="startButton" type="button">Iniciar corrida</button>
                            <button class="share-btn" id="shareButton" type="button">Compartilhar pontos</button>
                        </div>
                        <div class="score-board">
                            <h3>Recorde</h3>
                            <div class="best-score" id="bestScore">0 pontos</div>
                            <h3>Ultimas pontuacoes</h3>
                            <ul class="recent-scores" id="recentScores">
                                <li>Nenhuma corrida registrada ainda.</li>
                            </ul>
                        </div>
                    </div>
                </div>
                </div>
                <div class="game-hud">
                    <div class="hud-stack">
                        <div class="hud-box">
                            <span>Kilometragem</span>
                            <strong id="score">0 km</strong>
                        </div>
                        <div class="hud-box speedometer">
                            <span>Velocidade</span>
                            <strong id="speed">0 km/h</strong>
                        </div>
                        <div class="hud-box">
                            <span>Ultrapassagens</span>
                            <strong id="passes">0 carros</strong>
                        </div>
                        <div class="hud-box level-sign">
                            <span>Destino</span>
                            <strong id="level-city">Nova Alianca</strong>
                        </div>
                    </div>
                    <button class="fullscreen-btn" id="fullscreen-btn" type="button" aria-label="Colocar jogo em tela cheia">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M7 3H3v4h2V5h2V3zm12 0h-4v2h2v2h2V3zM5 15H3v6h6v-2H5v-4zm16 0h-2v4h-4v2h6v-6z"/>
                        </svg>
                    </button>
                </div>
                <div class="touch-controls" aria-label="Controles na tela">
                    <button class="touch-btn" data-touch="left" type="button" aria-label="Mover para a esquerda">&#8592;</button>
                    <button class="touch-btn" data-touch="right" type="button" aria-label="Mover para a direita">&#8594;</button>
                </div>
        </section>

    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const overlay = document.getElementById("overlay");
        const overlayMessage = document.getElementById("overlay-message");
        const startButton = document.getElementById("startButton");
        const shareButton = document.getElementById("shareButton");
        const scoreEl = document.getElementById("score");
        const passesEl = document.getElementById("passes");
        const speedEl = document.getElementById("speed");
        const fullscreenBtn = document.getElementById("fullscreen-btn");
        const levelCityEl = document.getElementById("level-city");
        const bestScoreEl = document.getElementById("bestScore");
        const recentScoresEl = document.getElementById("recentScores");
        const touchButtons = document.querySelectorAll(".touch-btn");
        const gameCard = document.querySelector(".game-card");

        const playerImage = new Image();
        playerImage.src = "gol-traseira.png";

        const obstacleCarFiles = [
            "320i.png",
            "palio.png",
            "amarok.png",
            "civic.png",
            "passat.png",
            "astra.png",
            "jetta.png"
        ];

        const obstacleCarImages = obstacleCarFiles.map((src) => {
            const image = new Image();
            image.src = src;
            return { src, image };
        });

        const potholeImage = new Image();
        potholeImage.src = "buraco.png";
        const logoImage = new Image();
        logoImage.src = "logo-BV.png";

        const storageKeys = {
            best: "gol-do-petrus-best-score",
            recent: "gol-do-petrus-recent-scores"
        };

        const world = {
            running: false,
            score: 0,
            passes: 0,
            distance: 0,
            time: 0,
            roadOffset: 0,
            spawnTimer: 0,
            lastTime: 0,
            enemySeed: 0
        };
        let crashSnapshotDataUrl = "";
        let crashScoreSaved = false;

        const clouds = [
            { x: 180, y: 96, scale: 1.2, speed: 14, alpha: 0.46 },
            { x: 760, y: 78, scale: 1.55, speed: 10, alpha: 0.4 },
            { x: 1160, y: 132, scale: 0.95, speed: 18, alpha: 0.34 }
        ];
        const stars = [
            { x: 0.08, y: 0.09, size: 1.8, twinkle: 0.4 },
            { x: 0.15, y: 0.18, size: 2.2, twinkle: 1.2 },
            { x: 0.22, y: 0.07, size: 1.6, twinkle: 2.1 },
            { x: 0.31, y: 0.16, size: 2.4, twinkle: 0.8 },
            { x: 0.42, y: 0.1, size: 1.9, twinkle: 1.7 },
            { x: 0.5, y: 0.2, size: 1.5, twinkle: 2.6 },
            { x: 0.59, y: 0.06, size: 2.2, twinkle: 1.4 },
            { x: 0.68, y: 0.15, size: 1.7, twinkle: 0.9 },
            { x: 0.77, y: 0.08, size: 2.5, twinkle: 2.4 },
            { x: 0.86, y: 0.17, size: 1.8, twinkle: 1.1 },
            { x: 0.93, y: 0.11, size: 2.1, twinkle: 2.9 }
        ];

        const input = {
            left: false,
            right: false,
            accelerate: false,
            brake: false
        };

        const player = {
            lane: 1,
            x: 0.5,
            targetX: 0.5,
            y: 0.83,
            width: 0,
            height: 0,
            crashTilt: 0
        };

        const obstacles = [];
        const lanePositions = [0.29, 0.5, 0.71];
        const baseCanvas = { width: 1280, height: 1024 };
        const initialSpawnDelay = 3;
        const levels = [
            { city: "Nova Alianca", label: "Nivel 1", min: 0, max: 10 },
            { city: "Bady Bassitt", label: "Nivel 2", min: 11, max: 20 },
            { city: "Rio Preto", label: "Nivel 3", min: 21, max: 30 },
            { city: "Orindiuva", label: "Nivel 4", min: 31, max: 40 },
            { city: "Sao Paulo", label: "Nivel 5", min: 41, max: 50 },
            { city: "Rio de Janeiro", label: "Nivel 6", min: 51, max: 60 },
            { city: "Bahia", label: "Nivel 7", min: 61, max: 70 },
            { city: "Borghi Veiculos", label: "Nivel 8", min: 71, max: Infinity }
        ];

        function getScaleX() {
            return canvas.width / baseCanvas.width;
        }

        function getScaleY() {
            return canvas.height / baseCanvas.height;
        }

        function updateCanvasSize() {
            const isFullscreen = document.fullscreenElement === gameCard;
            const isMobile = window.innerWidth <= 780;

            if (isFullscreen) {
                canvas.width = 1920;
                canvas.height = 1080;
            } else if (isMobile) {
                canvas.width = 720;
                canvas.height = 940;
            } else {
                canvas.width = 1280;
                canvas.height = 1024;
            }

            player.width = 168 * getScaleX();
            player.height = 246 * getScaleY();
        }

        function getDisplaySpeed() {
            const raw = getSpeed();
            const minRaw = 2.8;
            const maxRaw = 24;
            const normalized = Math.max(0, Math.min(1, (raw - minRaw) / (maxRaw - minRaw)));
            return Math.round(80 + normalized * 220);
        }

        function getStoredBestScore() {
            return Number(localStorage.getItem(storageKeys.best) || 0);
        }

        function getStoredRecentScores() {
            try {
                const parsed = JSON.parse(localStorage.getItem(storageKeys.recent) || "[]");
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                return [];
            }
        }

        function renderScoreHistory() {
            const bestScore = getStoredBestScore();
            const recentScores = getStoredRecentScores();

            bestScoreEl.textContent = `${bestScore} pontos`;

            if (!recentScores.length) {
                recentScoresEl.innerHTML = "<li>Nenhuma corrida registrada ainda.</li>";
                return;
            }

            recentScoresEl.innerHTML = recentScores
                .map((entry) => `<li><span>${entry.score} pts</span><span>${entry.passes} carros</span></li>`)
                .join("");
        }

        function saveScoreHistory() {
            const score = Math.floor(world.score);
            const passes = world.passes;
            const bestScore = Math.max(getStoredBestScore(), score);
            const recentScores = getStoredRecentScores();

            localStorage.setItem(storageKeys.best, String(bestScore));
            recentScores.unshift({ score, passes });
            localStorage.setItem(storageKeys.recent, JSON.stringify(recentScores.slice(0, 5)));
            renderScoreHistory();
        }

        function setOverlayState(title, message, showShare = false) {
            overlay.querySelector("h2").textContent = title;
            overlayMessage.textContent = message;
            shareButton.classList.toggle("visible", showShare);
        }

        function captureCrashSnapshot() {
            try {
                crashSnapshotDataUrl = canvas.toDataURL("image/png");
            } catch (error) {
                crashSnapshotDataUrl = "";
            }
        }

        async function buildShareImageBlob() {
            const shareCanvas = document.createElement("canvas");
            shareCanvas.width = 1280;
            shareCanvas.height = 1600;
            const shareCtx = shareCanvas.getContext("2d");

            shareCtx.fillStyle = "#070b12";
            shareCtx.fillRect(0, 0, shareCanvas.width, shareCanvas.height);

            shareCtx.fillStyle = "#d71920";
            shareCtx.fillRect(0, 0, shareCanvas.width, 26);

            if (crashSnapshotDataUrl) {
                const snapshot = new Image();
                await new Promise((resolve, reject) => {
                    snapshot.onload = resolve;
                    snapshot.onerror = reject;
                    snapshot.src = crashSnapshotDataUrl;
                });

                shareCtx.drawImage(snapshot, 70, 90, 1140, 912);
            }

            shareCtx.fillStyle = "rgba(7, 11, 18, 0.9)";
            shareCtx.fillRect(0, 1030, shareCanvas.width, 570);

            shareCtx.textAlign = "center";

            if (logoImage.complete && logoImage.naturalWidth > 0) {
                shareCtx.drawImage(logoImage, shareCanvas.width / 2 - 150, 1070, 300, 140);
            }

            shareCtx.fillStyle = "#ffffff";
            shareCtx.font = '700 60px "Orbitron", sans-serif';
            shareCtx.fillText("Gol do Petrus", shareCanvas.width / 2, 1280);

            shareCtx.fillStyle = "#f0f4fb";
            shareCtx.font = '700 72px "Space Grotesk", sans-serif';
            shareCtx.fillText(`${Math.floor(world.score)} pontos`, shareCanvas.width / 2, 1370);

            shareCtx.fillStyle = "#d1d8e5";
            shareCtx.font = '500 38px "Manrope", sans-serif';
            shareCtx.fillText(`Ultrapassagens: ${world.passes} carros`, shareCanvas.width / 2, 1435);
            shareCtx.fillText("Visite Borghi Veiculos e conheca o site.", shareCanvas.width / 2, 1500);
            shareCtx.fillText("borghiveiculos.github.io/site", shareCanvas.width / 2, 1550);

            return await new Promise((resolve) => {
                shareCanvas.toBlob((blob) => resolve(blob), "image/png");
            });
        }

        async function shareScore() {
            if (!crashSnapshotDataUrl) {
                return;
            }

            const text = `Eu fiz ${Math.floor(world.score)} pontos no Gol do Petrus e passei ${world.passes} carros. Visite o site da Borghi Veiculos: borghiveiculos.github.io/site`;

            try {
                const blob = await buildShareImageBlob();
                if (!blob) {
                    throw new Error("Nao foi possivel gerar a imagem de compartilhamento.");
                }

                const file = new File([blob], "gol-do-petrus.png", { type: "image/png" });
                if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
                    await navigator.share({
                        title: "Gol do Petrus",
                        text,
                        files: [file]
                    });
                    return;
                }

                const downloadUrl = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = downloadUrl;
                link.download = "gol-do-petrus.png";
                link.click();
                URL.revokeObjectURL(downloadUrl);
                window.alert("Imagem gerada. Ela foi baixada para voce compartilhar com seus pontos.");
            } catch (error) {
                window.alert("Nao foi possivel compartilhar agora.");
            }
        }

        function resetGame() {
            world.running = true;
            world.score = 0;
            world.passes = 0;
            world.distance = 0;
            world.time = 0;
            world.roadOffset = 0;
            world.spawnTimer = 0;
            world.lastTime = performance.now();
            world.enemySeed = 0;
            obstacles.length = 0;
            crashSnapshotDataUrl = "";
            crashScoreSaved = false;
            player.lane = 1;
            player.x = lanePositions[player.lane];
            player.targetX = lanePositions[player.lane];
            player.crashTilt = 0;
            updateHud();
            setOverlayState("Gol do Petrus", "Desvie dos carros, ultrapasse o transito e acelere cada vez mais.");
            overlay.classList.add("hidden");
            render();
        }

        function endGame() {
            if (!world.running) {
                return;
            }

            world.running = false;
            render();
            captureCrashSnapshot();

            if (!crashScoreSaved) {
                saveScoreHistory();
                crashScoreSaved = true;
            }

            startButton.textContent = "Jogar novamente";
            overlay.classList.remove("hidden");
            setOverlayState(
                "Fim de corrida",
                `Voce fez ${world.passes} ultrapassagens e ${Math.floor(world.score)} pontos.`,
                true
            );
        }

        function getSpeed() {
            const base = 2.8 + Math.min(16, world.distance * 0.02) + world.passes * 0.035;
            if (input.accelerate) return Math.min(base + 2.8, 24);
            if (input.brake) return Math.max(base - 3.8, 2.5);
            return Math.min(base, 21);
        }

        function updateHud() {
            const speed = getDisplaySpeed();
            const level = levels.find((item) => world.passes >= item.min && world.passes <= item.max) || levels[levels.length - 1];

            scoreEl.textContent = `${Math.floor(world.score)} km`;
            passesEl.textContent = `${world.passes} carros`;
            speedEl.textContent = `${speed} km/h`;
            levelCityEl.textContent = level.city;
        }

        function spawnObstacle() {
            const lane = Math.floor(Math.random() * lanePositions.length);
            const type = Math.random() < 0.28 ? "pothole" : "car";

            if (type === "pothole") {
                obstacles.push({
                    type,
                    lane,
                    x: lanePositions[lane],
                    y: 0.12,
                    width: (130 + Math.random() * 22) * getScaleX(),
                    height: (68 + Math.random() * 14) * getScaleY(),
                    speedFactor: 0.88 + Math.random() * 0.22,
                    image: potholeImage,
                    passed: false
                });
                return;
            }

            const vehicleSprite = obstacleCarImages[Math.floor(Math.random() * obstacleCarImages.length)];

            obstacles.push({
                type,
                lane,
                x: lanePositions[lane],
                y: 0.1,
                width: (128 + Math.random() * 18) * getScaleX(),
                height: (186 + Math.random() * 20) * getScaleY(),
                speedFactor: 0.72 + Math.random() * 0.36,
                image: vehicleSprite.image,
                passed: false
            });
        }

        function setAction(action, active) {
            input[action] = active;
        }

        function mixNumber(start, end, amount) {
            return start + (end - start) * amount;
        }

        function mixColor(from, to, amount) {
            return `rgb(${Math.round(mixNumber(from[0], to[0], amount))}, ${Math.round(mixNumber(from[1], to[1], amount))}, ${Math.round(mixNumber(from[2], to[2], amount))})`;
        }

        function getSkyPalette() {
            const progress = Math.max(0, Math.min(1, world.passes / 80));
            const morningTop = [92, 170, 245];
            const morningBottom = [198, 228, 255];
            const afternoonTop = [255, 148, 104];
            const afternoonBottom = [255, 210, 150];
            const nightTop = [14, 22, 58];
            const nightBottom = [38, 66, 126];
            let top;
            let bottom;

            if (progress < 0.45) {
                const phase = progress / 0.45;
                top = mixColor(morningTop, afternoonTop, phase);
                bottom = mixColor(morningBottom, afternoonBottom, phase);
            } else {
                const phase = (progress - 0.45) / 0.55;
                top = mixColor(afternoonTop, nightTop, phase);
                bottom = mixColor(afternoonBottom, nightBottom, phase);
            }

            const sunStrength = Math.max(0, 1 - progress * 1.35);
            const sunsetStrength = progress < 0.7 ? Math.max(0, 1 - Math.abs(progress - 0.45) / 0.25) : 0;
            const starOpacity = Math.max(0, (progress - 0.58) / 0.42);

            return { top, bottom, progress, sunStrength, sunsetStrength, starOpacity };
        }

        function drawStars(sky) {
            if (sky.starOpacity <= 0) {
                return;
            }

            stars.forEach((star) => {
                const pulse = 0.45 + 0.55 * ((Math.sin(world.time * 1.8 + star.twinkle) + 1) / 2);
                const alpha = sky.starOpacity * pulse * 0.9;
                ctx.fillStyle = `rgba(255,255,245,${alpha})`;
                ctx.beginPath();
                ctx.arc(canvas.width * star.x, canvas.height * (0.03 + star.y * 0.72), star.size * getScaleX(), 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawCloud(x, y, scale, alpha) {
            ctx.save();
            ctx.fillStyle = `rgba(255,255,255,${alpha})`;
            ctx.beginPath();
            ctx.ellipse(x - 58 * scale, y + 12 * scale, 40 * scale, 18 * scale, 0.08, 0, Math.PI * 2);
            ctx.ellipse(x - 18 * scale, y - 2 * scale, 54 * scale, 26 * scale, -0.02, 0, Math.PI * 2);
            ctx.ellipse(x + 34 * scale, y + 4 * scale, 48 * scale, 22 * scale, 0.04, 0, Math.PI * 2);
            ctx.ellipse(x + 84 * scale, y + 14 * scale, 34 * scale, 16 * scale, -0.08, 0, Math.PI * 2);
            ctx.ellipse(x + 2 * scale, y + 16 * scale, 92 * scale, 24 * scale, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawSky() {
            const sky = getSkyPalette();
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.28);
            skyGradient.addColorStop(0, sky.top);
            skyGradient.addColorStop(1, sky.bottom);
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height * 0.28);

            drawStars(sky);

            if (sky.sunStrength > 0.04 || sky.sunsetStrength > 0.1) {
                ctx.fillStyle = `rgba(255, 236, 168, ${0.16 + sky.sunStrength * 0.32 + sky.sunsetStrength * 0.12})`;
                ctx.beginPath();
                ctx.arc(canvas.width * 0.82, canvas.height * 0.1, 24 + sky.sunStrength * 18 + sky.sunsetStrength * 10, 0, Math.PI * 2);
                ctx.fill();
            }

            if (sky.sunsetStrength > 0.08) {
                const sunsetGlow = ctx.createRadialGradient(
                    canvas.width * 0.8,
                    canvas.height * 0.12,
                    10,
                    canvas.width * 0.8,
                    canvas.height * 0.12,
                    canvas.width * 0.18
                );
                sunsetGlow.addColorStop(0, `rgba(255, 171, 84, ${0.22 * sky.sunsetStrength})`);
                sunsetGlow.addColorStop(1, "rgba(255, 171, 84, 0)");
                ctx.fillStyle = sunsetGlow;
                ctx.fillRect(canvas.width * 0.6, 0, canvas.width * 0.32, canvas.height * 0.28);
            }

            clouds.forEach((cloud) => {
                const cloudAlpha = cloud.alpha * (1 - sky.starOpacity * 0.55) + sky.sunsetStrength * 0.08;
                drawCloud(cloud.x, cloud.y, cloud.scale, cloudAlpha);
            });
        }

        function projectX(normalizedX, y) {
            const roadCenter = canvas.width * 0.5;
            const roadWidthTop = canvas.width * 0.18;
            const roadWidthBottom = canvas.width * 0.78;
            const width = roadWidthTop + (roadWidthBottom - roadWidthTop) * y;
            return roadCenter + (normalizedX - 0.5) * width * 1.34;
        }

        function drawRoad() {
            const horizonY = canvas.height * 0.2;
            const roadBottomWidth = canvas.width * 0.86;
            const roadTopWidth = canvas.width * 0.22;
            const centerX = canvas.width / 2;

            ctx.fillStyle = "#2f7d32";
            ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);

            ctx.fillStyle = "#525966";
            ctx.beginPath();
            ctx.moveTo(centerX - roadTopWidth / 2, horizonY);
            ctx.lineTo(centerX + roadTopWidth / 2, horizonY);
            ctx.lineTo(centerX + roadBottomWidth / 2, canvas.height);
            ctx.lineTo(centerX - roadBottomWidth / 2, canvas.height);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#e7ebf5";
            for (let i = 0; i < 12; i += 1) {
                const t = ((i * 240 + world.roadOffset) % 2200) / 2200;
                const y = horizonY + t * (canvas.height - horizonY);
                const width = 6 + t * 12;
                const height = 10 + t * 16;
                ctx.fillRect(centerX - width / 2, y, width, height);
            }

            ctx.strokeStyle = "rgba(38, 42, 50, 0.9)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(centerX - roadTopWidth / 2 + 2, horizonY);
            ctx.lineTo(centerX - roadBottomWidth / 2 + 4, canvas.height);
            ctx.moveTo(centerX + roadTopWidth / 2 - 2, horizonY);
            ctx.lineTo(centerX + roadBottomWidth / 2 - 4, canvas.height);
            ctx.stroke();

            ctx.fillStyle = "#d8b36a";
            ctx.beginPath();
            ctx.moveTo(centerX - roadTopWidth / 2 - 10, horizonY);
            ctx.lineTo(centerX - roadBottomWidth / 2 - 52, canvas.height);
            ctx.lineTo(centerX - roadBottomWidth / 2 - 86, canvas.height);
            ctx.lineTo(centerX - roadTopWidth / 2 - 26, horizonY);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(centerX + roadTopWidth / 2 + 10, horizonY);
            ctx.lineTo(centerX + roadBottomWidth / 2 + 52, canvas.height);
            ctx.lineTo(centerX + roadBottomWidth / 2 + 86, canvas.height);
            ctx.lineTo(centerX + roadTopWidth / 2 + 26, horizonY);
            ctx.closePath();
            ctx.fill();
        }

        function drawCarObstacle(obstacle) {
            const scale = 0.45 + obstacle.y * 0.95;
            const w = obstacle.width * scale;
            const h = obstacle.height * scale;
            const x = projectX(obstacle.x, obstacle.y) - w / 2;
            const y = canvas.height * obstacle.y;

            if (obstacle.image && obstacle.image.complete && obstacle.image.naturalWidth > 0) {
                ctx.save();
                ctx.drawImage(obstacle.image, x, y, w, h);
                ctx.restore();
                return;
            }

            ctx.save();
            ctx.fillStyle = "#cbd5e1";
            roundRect(ctx, x, y, w, h, 16 * scale);
            ctx.fill();

            ctx.fillStyle = "rgba(12, 18, 26, 0.82)";
            roundRect(ctx, x + w * 0.16, y + h * 0.1, w * 0.68, h * 0.24, 10 * scale);
            ctx.fill();

            ctx.fillStyle = "#f8fafc";
            roundRect(ctx, x + w * 0.18, y + h * 0.04, w * 0.18, h * 0.1, 4 * scale);
            ctx.fill();
            roundRect(ctx, x + w * 0.64, y + h * 0.04, w * 0.18, h * 0.1, 4 * scale);
            ctx.fill();

            ctx.fillStyle = "rgba(12, 18, 26, 0.4)";
            roundRect(ctx, x + w * 0.12, y + h * 0.44, w * 0.76, h * 0.18, 8 * scale);
            ctx.fill();

            ctx.fillStyle = "#111827";
            ctx.beginPath();
            ctx.arc(x + w * 0.24, y + h * 0.86, w * 0.11, 0, Math.PI * 2);
            ctx.arc(x + w * 0.76, y + h * 0.86, w * 0.11, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawPothole(obstacle) {
            const scale = 0.5 + obstacle.y * 0.9;
            const w = obstacle.width * scale;
            const h = obstacle.height * scale;
            const x = projectX(obstacle.x, obstacle.y) - w / 2;
            const y = canvas.height * obstacle.y;

            if (obstacle.image && obstacle.image.complete && obstacle.image.naturalWidth > 0) {
                ctx.save();
                ctx.drawImage(obstacle.image, x, y, w, h);
                ctx.restore();
                return;
            }

            ctx.save();
            ctx.fillStyle = "rgba(26, 18, 16, 0.85)";
            ctx.beginPath();
            ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "rgba(103, 90, 82, 0.8)";
            ctx.lineWidth = Math.max(2, scale * 3.2);
            ctx.beginPath();
            ctx.ellipse(x + w / 2, y + h / 2, w / 2.12, h / 2.14, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        function drawPlayer() {
            const w = player.width;
            const h = player.height;
            const x = projectX(player.x, player.y) - w / 2;
            const y = canvas.height * player.y - h / 2;

            ctx.save();
            ctx.translate(x + w / 2, y + h / 2);
            ctx.rotate(player.crashTilt);

            if (playerImage.complete && playerImage.naturalWidth > 0) {
                ctx.drawImage(playerImage, -w / 2, -h / 2, w, h);
            } else {
                ctx.fillStyle = "#e01927";
                roundRect(ctx, -w / 2, -h / 2, w, h, 24);
                ctx.fill();
            }

            ctx.restore();
        }

        function drawCockpitText() {
            return;
        }

        function checkCollision(obstacle) {
            const scale = 0.45 + obstacle.y * 0.95;
            const widthFactor = obstacle.type === "pothole" ? 0.82 : 0.74;
            const heightFactor = obstacle.type === "pothole" ? 0.62 : 0.78;
            const ew = obstacle.width * scale * widthFactor;
            const eh = obstacle.height * scale * heightFactor;
            const ex = projectX(obstacle.x, obstacle.y) - ew / 2;
            const ey = canvas.height * obstacle.y;

            const pw = player.width * 0.58;
            const ph = player.height * 0.72;
            const px = projectX(player.x, player.y) - pw / 2;
            const py = canvas.height * player.y - player.height / 2 + 28;

            return px < ex + ew && px + pw > ex && py < ey + eh && py + ph > ey;
        }

        function roundRect(context, x, y, width, height, radius) {
            context.beginPath();
            context.moveTo(x + radius, y);
            context.arcTo(x + width, y, x + width, y + height, radius);
            context.arcTo(x + width, y + height, x, y + height, radius);
            context.arcTo(x, y + height, x, y, radius);
            context.arcTo(x, y, x + width, y, radius);
            context.closePath();
        }

        function update(delta) {
            clouds.forEach((cloud) => {
                cloud.x += cloud.speed * delta;
                if (cloud.x - 180 * cloud.scale > canvas.width) {
                    cloud.x = -220 * cloud.scale;
                }
            });

            if (!world.running) {
                world.time += delta;
                world.roadOffset += delta * 120;
                return;
            }

            const speed = getSpeed();
            world.roadOffset += speed * delta * 520;
            world.distance += delta;
            world.time += delta;
            world.spawnTimer += delta;
            world.score += speed * delta * 6;

            if (input.left) {
                player.lane = Math.max(0, player.lane - 1);
                input.left = false;
            }

            if (input.right) {
                player.lane = Math.min(lanePositions.length - 1, player.lane + 1);
                input.right = false;
            }

            player.targetX = lanePositions[player.lane];
            player.x += (player.targetX - player.x) * Math.min(1, delta * 10);
            player.crashTilt *= 0.86;

            const spawnInterval = Math.max(0.58, 1.5 - world.distance * 0.012);
            if (world.time >= initialSpawnDelay && world.spawnTimer >= spawnInterval) {
                spawnObstacle();
                world.spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i -= 1) {
                const obstacle = obstacles[i];
                obstacle.y += delta * (speed * 0.12 + obstacle.speedFactor * 0.34);

                if (checkCollision(obstacle)) {
                    player.crashTilt = 0.14;
                    endGame();
                    break;
                }

                if (!obstacle.passed && obstacle.y > player.y + 0.08) {
                    obstacle.passed = true;
                    world.passes += 1;
                    world.score += 120 + world.passes * 18;
                }

                if (obstacle.y > 1.18) {
                    obstacles.splice(i, 1);
                }
            }

            updateHud();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawSky();
            drawRoad();

            obstacles
                .slice()
                .sort((a, b) => a.y - b.y)
                .forEach((obstacle) => {
                    if (obstacle.type === "pothole") {
                        drawPothole(obstacle);
                        return;
                    }
                    drawCarObstacle(obstacle);
                });

            drawPlayer();
            drawCockpitText();
        }

        function loop(timestamp) {
            const delta = Math.min((timestamp - world.lastTime) / 1000 || 0.016, 0.032);
            world.lastTime = timestamp;
            update(delta);
            render();
            requestAnimationFrame(loop);
        }

        window.addEventListener("keydown", (event) => {
            if (["ArrowLeft", "a", "A"].includes(event.key)) setAction("left", true);
            if (["ArrowRight", "d", "D"].includes(event.key)) setAction("right", true);
            if (["ArrowUp", "w", "W"].includes(event.key)) setAction("accelerate", true);
            if (["ArrowDown", "s", "S"].includes(event.key)) setAction("brake", true);
        });

        window.addEventListener("keyup", (event) => {
            if (["ArrowLeft", "a", "A"].includes(event.key)) setAction("left", false);
            if (["ArrowRight", "d", "D"].includes(event.key)) setAction("right", false);
            if (["ArrowUp", "w", "W"].includes(event.key)) setAction("accelerate", false);
            if (["ArrowDown", "s", "S"].includes(event.key)) setAction("brake", false);
        });

        startButton.addEventListener("click", () => {
            startButton.textContent = "Reiniciar corrida";
            resetGame();
        });

        shareButton.addEventListener("click", () => {
            shareScore();
        });

        fullscreenBtn.addEventListener("click", async () => {
            if (document.fullscreenElement) {
                await document.exitFullscreen();
                return;
            }

            await gameCard.requestFullscreen();
        });

        document.addEventListener("fullscreenchange", () => {
            updateCanvasSize();
            render();
        });

        window.addEventListener("resize", () => {
            updateCanvasSize();
            render();
        });

        touchButtons.forEach((button) => {
            const action = button.dataset.touch;
            button.addEventListener("pointerdown", () => {
                button.classList.add("active");
                setAction(action, true);
            });
            const clear = () => {
                button.classList.remove("active");
                setAction(action, false);
            };
            button.addEventListener("pointerup", clear);
            button.addEventListener("pointerleave", clear);
            button.addEventListener("pointercancel", clear);
        });

        playerImage.addEventListener("load", render);
        renderScoreHistory();
        setOverlayState("Gol do Petrus", "Desvie dos carros, ultrapasse o transito e acelere cada vez mais.");
        updateCanvasSize();
        render();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
